// 4. IMPORT FUNCTIONS

async function importCropCategories() {
    const batch = writeBatch(db);

    cropCategories.forEach((category) => {
        const ref = doc(db, "crop_categories", category.id);

        batch.set(ref, {
            ...category,
            created_at: serverTimestamp(),
            updated_at: serverTimestamp()
        });
    });

    await batch.commit();

    console.log("✅ Đã thêm crop_categories");
}

async function importCrops() {
    const batch = writeBatch(db);

    crops.forEach((crop) => {
        const ref = doc(db, "crops", crop.id);

        batch.set(ref, {
            alternative_names_vi: [],
            alternative_names_en: [],
            is_signature_vietnamese_crop: false,
            ...crop,
            created_at: serverTimestamp(),
            updated_at: serverTimestamp()
        });
    });

    await batch.commit();

    console.log("✅ Đã thêm crops");
}

async function importAgricultureTerms() {
    const batch = writeBatch(db);

    agricultureTerms.forEach((term) => {
        const ref = doc(db, "agriculture_terms", term.id);

        batch.set(ref, {
            ...term,
            created_at: serverTimestamp(),
            updated_at: serverTimestamp()
        });
    });

    await batch.commit();

    console.log("✅ Đã thêm agriculture_terms");
}

async function importRecommendations() {
    const batch = writeBatch(db);

    recommendations.forEach((item, index) => {
        const ref = doc(db, "recommendations", `rec_${index + 1}`);

        batch.set(ref, {
            ...item,
            created_at: serverTimestamp(),
            updated_at: serverTimestamp()
        });
    });

    await batch.commit();

    console.log("✅ Đã thêm recommendations");
}

async function importDiseases() {
    const batch = writeBatch(db);

    diseases.forEach((item, index) => {
        const ref = doc(db, "diseases", `disease_${index + 1}`);

        batch.set(ref, {
            ...item,
            created_at: serverTimestamp(),
            updated_at: serverTimestamp()
        });
    });

    await batch.commit();

    console.log("✅ Đã thêm diseases");
}

async function importAllData() {
    try {

        console.log("🚀 Bắt đầu import dữ liệu...");

        await importCropCategories();
        await importCrops();
        await importAgricultureTerms();
        await importRecommendations();
        await importDiseases();

        console.log("🎉 Import hoàn tất!");
        alert("Đã import toàn bộ dữ liệu vào Firestore.");

    } catch (error) {

        console.error("Lỗi:", error);
        alert(error.message);

    }
}

window.importAllData = importAllData;

    window.importAllData = importAllData;
