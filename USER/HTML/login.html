<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
</head>
<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#1f490a;
}

.container{
    width:100%;
    display:flex;
    justify-content:center;
}

.login-box{
    width:320px;
    background:#fff;
    padding:30px 18px;
    border-radius:6px;
}

.login-box h2{
    text-align:center;
    margin-bottom:25px;
    color:#333;
}

.login-box input{
    width:100%;
    height:38px;
    border:1px solid #ddd;
    border-radius:3px;
    padding:0 10px;
    outline:none;
    margin-bottom:12px;
}

.password-box{
    position:relative;
}

.password-box i{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    color:#999;
    cursor:pointer;
}

.forgot{
    display:block;
    text-align:center;
    text-decoration:none;
    color:#4b6fe8;
    font-size:12px;
    margin-bottom:18px;
}

.login-btn{
    width:100%;
    height:40px;
    border:none;
    background:#3567d6;
    color:#fff;
    border-radius:4px;
    cursor:pointer;
    margin-bottom:15px;
    font-size:15px;
}

.signup{
    text-align:center;
    font-size:13px;
    color:#555;
}

.signup a{
    text-decoration:none;
    color:#3567d6;
    font-weight:600;
}

.divider{
    display:flex;
    align-items:center;
   
    margin:22px 0;
}

.divider span{
    flex:1;
    height:1px;
    background:#ddd;
}

.divider p{
    font-size:13px;
    color:#777;
}

.facebook,
.google{
    width:100%;
    height:40px;
    border-radius:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    cursor:pointer;
    font-size:14px;
}

.facebook{
    background:#4b64b9;
    color:#fff;
    border:none;
    margin-bottom:12px;
}

.facebook i{
    font-size:18px;
}
</style>
<body>
    <div class="container">
        <div class="login-box">
            <h2>Login for admin</h2>

            <input type="email" placeholder="Email" id="txt-email">

            <div class="password-box">
                <input type="password" placeholder="Password" id="txt-password">
            </div>

           

            <button class="login-btn" id="btn-login">Login</button>

           

            <div class="divider">
                <span></span>
                <p>If you aren't an admin.</p>
               
                <span></span>
                
            </div>
             <div class="divider">
                <span></span>
                <p>Please! Click the button below to login as a user.</p>
               
                <span></span>
                
            </div>
            <a href="/USER/HTML/Web_App.html"><button class="facebook"  id="fbButton">
                I'm User
            </button></a>

        
        </div>
    </div>
    <script type="module" src="../JS/auth.js"></script>
</body>
</html>
